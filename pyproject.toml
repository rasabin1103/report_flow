[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ase-reportflow"
version = "0.1.0"
description = "Standalone deterministic spreadsheet to PDF reporting"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "reportlab>=4.2,<6", "matplotlib>=3.9,<4", "numpy>=2,<3", "python-multipart>=0.0.20,<1", "typer>=0.15,<1", "pillow>=11,<14"]
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy", "pandas-stubs", "pypdf"]
[project.scripts]
reportflow = "cli.main:app"
[tool.setuptools.packages.find]
include = ["app*", "cli*"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
