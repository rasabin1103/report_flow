name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check app cli tests scripts
      - run: ruff format --check app cli tests scripts
      - run: mypy app cli
      - run: pytest -q
      - run: python scripts/generate_examples.py
      - run: python scripts/generate_branded_example.py
      - run: docker build -t reportflow:test .
