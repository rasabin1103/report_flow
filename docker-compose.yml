services:
  reportflow:
    build: .
    ports:
      - "127.0.0.1:${REPORTFLOW_PORT:-8000}:8000"
    environment:
      REPORTFLOW_MAX_FILE_BYTES: 10485760
      REPORTFLOW_MAX_ROWS: 50000
      REPORTFLOW_MAX_COLUMNS: 80
      REPORTFLOW_TIMEOUT_SECONDS: 60
      REPORTFLOW_MAX_PAGES: 100
      REPORTFLOW_MAX_CONCURRENT_JOBS: 2
    mem_limit: 1g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
